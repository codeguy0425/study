<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成語温習字卡 App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Premium Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', "Microsoft JhengHei", system-ui, sans-serif;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', "PingFang TC", "Songti TC", serif;
    }
    /* 3D Card Flip Effects */
    .perspective {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-amber-50/60 min-h-screen flex flex-col justify-between p-4 md:p-6 select-none">

  <header class="text-center my-2 md:my-4 w-full max-w-md mx-auto">
    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-wider font-serif-tc">成語温習字卡</h1>
    
    <!-- Unit Selector Segmented Control -->
    <div class="mt-4 bg-slate-200/60 backdrop-blur-sm p-1 rounded-xl grid grid-cols-4 gap-1 text-xs font-semibold shadow-inner border border-slate-300/50">
      <button onclick="changeUnit('3')" id="btn-unit-3" class="py-2 px-1 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer">單元三</button>
      <button onclick="changeUnit('4')" id="btn-unit-4" class="py-2 px-1 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer">單元四</button>
      <button onclick="changeUnit('5')" id="btn-unit-5" class="py-2 px-1 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer">單元五</button>
      <button onclick="changeUnit('all')" id="btn-unit-all" class="py-2 px-1 rounded-lg text-slate-600 hover:text-slate-900 transition-all cursor-pointer">全部</button>
    </div>
    
    <div class="mt-4 flex justify-between items-center px-1">
      <span id="unit-title-text" class="text-xs font-bold uppercase tracking-wider text-amber-800 bg-amber-100/95 px-3 py-1 rounded-lg shadow-sm border border-amber-200/40">
        單元三 言辭論辯
      </span>
      <p id="progress-text" class="text-sm font-semibold text-slate-500 font-mono">進度：1 / 8</p>
    </div>
  </header>

  <div class="w-full max-w-md h-96 perspective cursor-pointer my-auto mx-auto" onclick="toggleFlip()">
    <div id="flashcard" class="relative w-full h-full duration-500 preserve-3d transition-transform">
      
      <!-- Front of Card -->
      <div class="absolute w-full h-full backface-hidden bg-white rounded-2xl shadow-xl border border-slate-100 flex flex-col justify-between p-6 md:p-8 text-center bg-gradient-to-br from-white to-amber-50/10">
        <div id="card-id-front" class="text-slate-300 font-mono text-left font-bold tracking-wider text-sm">3.1</div>
        <div class="flex flex-col items-center justify-center flex-1">
          <h2 id="card-idiom" class="text-4xl md:text-5xl font-black text-slate-800 tracking-wider mb-4 font-serif-tc leading-snug">
            暢所欲言
          </h2>
          <p id="card-pinyin" class="text-md text-amber-600 font-semibold tracking-wide font-mono">〔 chàng suǒ yù yán 〕</p>
        </div>
        <div class="text-xs text-slate-400 font-medium animate-pulse">💡 點擊字卡查看解釋</div>
      </div>

      <!-- Back of Card -->
      <div class="absolute w-full h-full backface-hidden bg-slate-800 text-white rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col justify-between rotate-y-180 border border-slate-700/50 bg-gradient-to-br from-slate-800 to-slate-900">
        <div>
          <div class="flex justify-between items-center pb-3 border-b border-slate-700 mb-4">
            <span id="card-idiom-back" class="text-2xl font-bold text-amber-400 font-serif-tc">暢所欲言</span>
            <span id="card-id-back" class="text-xs font-mono text-slate-400 font-bold">3.1</span>
          </div>
          
          <div class="space-y-4">
            <div>
              <h4 class="text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-1.5 flex items-center gap-1">
                <span>【 解釋 】</span>
              </h4>
              <p id="card-explanation" class="text-slate-200 text-sm md:text-base leading-relaxed tracking-wide font-serif-tc">
                痛痛快快地把想說的話都說出來。
              </p>
            </div>
            <div>
              <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400/90 mb-1.5 flex items-center gap-1">
                <span>【 例句 】</span>
              </h4>
              <p id="card-example" class="text-slate-300 text-sm md:text-base leading-relaxed tracking-wide italic font-serif-tc">
                「在這次座談會上，大家暢所欲言，提出了許多寶貴的意見。」
              </p>
            </div>
          </div>
        </div>
        
        <div class="text-center text-xs text-slate-500 font-medium">💡 點擊字卡返回正面</div>
      </div>

    </div>
  </div>

  <footer class="w-full max-w-md grid grid-cols-3 gap-3 mb-4 mx-auto">
    <button onclick="prevCard(event)" class="px-4 py-3.5 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold rounded-xl shadow-sm active:scale-95 transition-all cursor-pointer text-sm">
      上一個
    </button>
    <button onclick="randomCard(event)" class="px-4 py-3.5 bg-amber-100 hover:bg-amber-200/90 text-amber-800 font-bold rounded-xl shadow-sm active:scale-95 transition-all text-sm cursor-pointer">
      隨機抽卡
    </button>
    <button onclick="nextCard(event)" class="px-4 py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-sm active:scale-95 transition-all cursor-pointer text-sm">
      下一個
    </button>
  </footer>

  <script>

    const allIdiomData = [

        explanation: "用豆秸來煮豆子。比喻骨肉相殘或同胞之間互相殘害。",
        example: "他們本是親兄弟，如今卻為了爭奪遺產而煮豆燃萁，真令人痛心。"
      },
      {
        id: "4.6",
        unit: "4",
        unitName: "單元四 倫理人際",

        explanation: "同一個山丘上的貉。比喻彼此同等惡劣，沒有差別。",

      },
      {
        id: "4.8",
        unit: "4",
        unitName: "單元四 倫理人際",
        idiom: "管鮑之交",
        pinyin: "guǎn bào zhī jiāo",
        explanation: "指春秋時管仲和鮑叔牙深厚、無私的友誼。比喻交情深厚、彼此信任的朋友。",
        example: "他們兩人從小一起長大，患難與共，真是管鮑之交。"
      },

      // ==========================================
      // 單元五 態度行為
      // ==========================================
      {
        id: "5.1",

      {

        explanation: "睡在柴草上，經常嚐苦膽。形容人刻苦自勵，發憤圖強，以圖報仇雪恥或成就事業。",
        example: "經過十年的臥薪嚐膽，這家小公司終於打敗了強大的競爭對手。"

      {
        id: "5.3",

        example: "現代的手機導航非常方便，我們只要按圖索驥就能輕鬆找到餐廳。"

      {

        explanation: "畫好蛇後又為牠添上腳。比喻多此一舉，不僅無益，反而壞了事情。",

      },
      {
        id: "5.6",
        unit: "5",
        unitName: "單元五 態度行為",

        explanation: "幫助夏桀做壞事。比喻協助惡人做壞事，幫凶作惡。",
        example: "我們絕不能和那些不法之徒同流合污，做出助桀為虐的事情。"
      },
      {
        id: "5.7",
        unit: "5",
        unitName: "單元五 態度行為",
        idiom: "退避三舍",
        pinyin: "tuì bì sān shè",
        explanation: "主動退讓九十里（古時一舍為三十里）。比喻對人讓步、迴避，不與之正面衝突，或自認不如而遠離。",
        example: "他的脾氣非常暴躁，大家一見到他都退避三舍，不敢招惹他。"
      },
      {
        id: "5.8",
        unit: "5",
        unitName: "單元五 態度行為",
        idiom: "亡羊補牢",
        pinyin: "wáng yáng bǔ láo",
        explanation: "羊逃跑了再去修補羊圈。比喻在受到損失或出錯後及時想辦法補救，免得以後再受損失。",
        example: "雖然這次期中考考砸了，但只要現在亡羊補牢，期末考還是有希望的。"
      }
    ];

    let currentUnit = "3"; // Start with Unit 3
    let idiomData = [];    // Filtered idioms active for study
    let currentIndex = 0;
    let isFlipped = false;

    // DOM Elements
    const flashcardEl = document.getElementById('flashcard');
    const progressTextEl = document.getElementById('progress-text');
    const unitTitleTextEl = document.getElementById('unit-title-text');
    
    // Front Element Targets
    const cardIdFrontEl = document.getElementById('card-id-front');
    const cardIdiomEl = document.getElementById('card-idiom');
    const cardPinyinEl = document.getElementById('card-pinyin');
    
    // Back Element Targets
    const cardIdiomBackEl = document.getElementById('card-idiom-back');
    const cardIdBackEl = document.getElementById('card-id-back');
    const cardExplanationEl = document.getElementById('card-explanation');
    const cardExampleEl = document.getElementById('card-example');

    // Initialize Active Unit data on load
    function initApp() {
      changeUnit('3', true);
    }

    // Change unit filter
    function changeUnit(unit, isInitial = false) {
      currentUnit = unit;
      
      // Update UI button highlights
      const units = ['3', '4', '5', 'all'];
      units.forEach(u => {
        const btn = document.getElementById(`btn-unit-${u}`);
        if (u === unit) {
          btn.className = "py-2 px-1 rounded-lg bg-white text-slate-900 shadow-sm font-bold transition-all cursor-pointer scale-102";
        } else {
          btn.className = "py-2 px-1 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100/50 transition-all cursor-pointer";
        }
      });

      // Update filtered data
      if (unit === 'all') {
        idiomData = [...allIdiomData];
        unitTitleTextEl.textContent = "全部單元 綜合溫習";
        unitTitleTextEl.className = "text-xs font-bold uppercase tracking-wider text-indigo-800 bg-indigo-100/95 px-3 py-1 rounded-lg shadow-sm border border-indigo-200/40";
      } else {
        idiomData = allIdiomData.filter(item => item.unit === unit);
        const nameMap = {
          '3': "單元三 言辭論辯",
          '4': "單元四 倫理人際",
          '5': "單元五 態度行為"
        };
        unitTitleTextEl.textContent = nameMap[unit];
        unitTitleTextEl.className = "text-xs font-bold uppercase tracking-wider text-amber-800 bg-amber-100/95 px-3 py-1 rounded-lg shadow-sm border border-amber-200/40";
      }

      currentIndex = 0;

      if (isInitial) {
        updateCardDOM();
      } else {
        safeNavigate(() => {});
      }
    }

    function updateCardDOM() {
      if (idiomData.length === 0) return;
      const current = idiomData[currentIndex];
      
      // Update data text on card front
      cardIdFrontEl.textContent = current.id;
      cardIdiomEl.textContent = current.idiom;
      cardPinyinEl.textContent = `〔 ${current.pinyin} 〕`;
      
      // Update data text on card back
      cardIdiomBackEl.textContent = current.idiom;
      cardIdBackEl.textContent = current.id;
      cardExplanationEl.textContent = current.explanation;
      cardExampleEl.textContent = `「${current.example}」`;
      
      // Update counter progress text
      progressTextEl.textContent = `進度：${currentIndex + 1} / ${idiomData.length}`;
    }

    function toggleFlip() {
      isFlipped = !isFlipped;
      if (isFlipped) {
        flashcardEl.classList.add('rotate-y-180');
      } else {
        flashcardEl.classList.remove('rotate-y-180');
      }
    }

    function safeNavigate(navigationCallback) {
      // If card is flipped, flip back first then change content smoothly
      if (isFlipped) {
        toggleFlip();
        setTimeout(() => {
          navigationCallback();
          updateCardDOM();
        }, 220); // Sync timing with transition-duration (500ms -> flip visual finishes early)
      } else {
        navigationCallback();
        updateCardDOM();
      }
    }

    function nextCard(event) {
      event.stopPropagation(); // Stop card from flipping when clicking button
      safeNavigate(() => {
        currentIndex = (currentIndex + 1) % idiomData.length;
      });
    }

    function prevCard(event) {
      event.stopPropagation();
      safeNavigate(() => {
        currentIndex = (currentIndex - 1 + idiomData.length) % idiomData.length;
      });
    }

    function randomCard(event) {
      event.stopPropagation();
      safeNavigate(() => {
        let randomIndex;
        // Make sure it doesn't choose the same index sequentially if possible
        do {
          randomIndex = Math.floor(Math.random() * idiomData.length);
        } while (randomIndex === currentIndex && idiomData.length > 1);
        currentIndex = randomIndex;
      });
    }

    // Run initializer on startup
    window.onload = initApp;
  </script>
</body>
